<svg xmlns="http://www.w3.org/2000/svg" viewBox="-119 -13 674 163" width="674" height="163" role="img" aria-labelledby="title">
  <title id="title">Portage</title>
  <defs>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#eef0f3"/>
      <stop offset="0.48" stop-color="#b9bfc8"/>
      <stop offset="0.52" stop-color="#7f8793"/>
      <stop offset="0.8" stop-color="#aab1ba"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <!-- Web 2.0 gloss: bright at the top, fading down to the swoop -->
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="48">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="142">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="0.35" stop-color="#3a3a3a"/>
      <stop offset="0.7" stop-color="#111"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="-109" y1="0" x2="545" y2="0">
      <stop offset="0" stop-color="#9aa1ab" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9aa1ab" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9aa1ab" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#0b0d10" flood-opacity="0.3"/>
    </filter>
    <mask id="face" maskUnits="userSpaceOnUse" x="-119" y="-16" width="674" height="190">
      <use href="#italic" stroke="#fff" stroke-width="22"/>
    </mask>
    <mask id="reflect" maskUnits="userSpaceOnUse" x="-119" y="112" width="674" height="190">
      <rect x="-119" y="112" width="674" height="190" fill="url(#fade)"/>
    </mask>
    <!-- Hand-built letterforms on a 100-unit cap height, 22-unit stroke. -->
    <g id="word" fill="none" stroke-linejoin="miter" stroke-linecap="square">
      <g transform="translate(-88 20) scale(0.6)"><path d="M11 11L61 50L11 89"/></g><!-- > prompt -->
      <g transform="translate(0 0)"><path d="M11 11V89M11 11H34A24 24 0 0 1 34 59H11"/></g><!-- P -->
      <g transform="translate(70 0)"><rect x="11" y="11" width="58" height="78" rx="29"/></g><!-- O -->
      <g transform="translate(151 0)"><path d="M11 11V89M11 11H34A24 24 0 0 1 34 59H11M34 59A24 24 0 0 1 58 83V89"/></g><!-- R -->
      <g transform="translate(221 0)"><path d="M11 11H59M35 11V89"/></g><!-- T -->
      <g transform="translate(292 0)"><path d="M11 89V40A29 29 0 0 1 69 40V89M11 64H69"/></g><!-- A -->
      <g transform="translate(373 0)"><path d="M62.2 21.4A29 29 0 0 0 11 40V60A29 29 0 0 0 69 60V58H48"/></g><!-- G -->
      <g transform="translate(454 0)"><path d="M58 11H11V89H58M11 50H49"/></g><!-- E -->
    </g>
    <g id="italic" transform="skewX(-12)"><use href="#word"/></g>
    <g id="logo">
      <!-- isometric extrusion, back to front -->
        <use href="#italic" transform="translate(12.12 7.00)" stroke="#1f232a" stroke-width="27"/>
        <use href="#italic" transform="translate(12.12 7.00)" stroke="#2a2f38" stroke-width="22"/>
        <use href="#italic" transform="translate(11.26 6.50)" stroke="#2f343e" stroke-width="22"/>
        <use href="#italic" transform="translate(10.39 6.00)" stroke="#343943" stroke-width="22"/>
        <use href="#italic" transform="translate(9.53 5.50)" stroke="#393f49" stroke-width="22"/>
        <use href="#italic" transform="translate(8.66 5.00)" stroke="#3e444e" stroke-width="22"/>
        <use href="#italic" transform="translate(7.79 4.50)" stroke="#434954" stroke-width="22"/>
        <use href="#italic" transform="translate(6.93 4.00)" stroke="#484e59" stroke-width="22"/>
        <use href="#italic" transform="translate(6.06 3.50)" stroke="#4d545f" stroke-width="22"/>
        <use href="#italic" transform="translate(5.20 3.00)" stroke="#525964" stroke-width="22"/>
        <use href="#italic" transform="translate(4.33 2.50)" stroke="#575e6a" stroke-width="22"/>
        <use href="#italic" transform="translate(3.46 2.00)" stroke="#5c636f" stroke-width="22"/>
        <use href="#italic" transform="translate(2.60 1.50)" stroke="#616975" stroke-width="22"/>
        <use href="#italic" transform="translate(1.73 1.00)" stroke="#666e7a" stroke-width="22"/>
        <use href="#italic" transform="translate(0.87 0.50)" stroke="#6b7380" stroke-width="22"/>
      <!-- front face -->
      <use href="#italic" stroke="#3e4552" stroke-width="27"/>
      <use href="#italic" stroke="url(#silver)" stroke-width="22"/>
      <!-- gloss, cut off by a swoop, kept inside the letter faces -->
      <path mask="url(#face)" fill="url(#gloss)" d="M-112 -16H563V22C331 70 171 10 -112 58Z"/>
      <path mask="url(#face)" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.95" d="M563 22C331 70 171 10 -112 58"/>
    </g>
  </defs>
  <!-- reflection on the glass surface -->
  <g mask="url(#reflect)">
    <use href="#logo" transform="matrix(1 0 0 -1 0 224)"/>
  </g>
  <rect x="-109" y="111.5" width="654" height="1" fill="url(#glass)"/>
  <use href="#logo" filter="url(#shadow)"/>
</svg>
