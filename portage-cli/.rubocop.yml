AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "*.gemspec"

Metrics/MethodLength:
  Max: 15
  # Each write_* method is a literal template being heredoc'd to disk —
  # length there is the file being scaffolded, not branching logic.
  Exclude:
    - "lib/portage/cli/generate/adapter.rb"

Metrics/AbcSize:
  Max: 25

# Buy's initializer is one keyword per CLI flag (url, query, qty,
# payment_token, yes, dry_run, product_id, auto_open, notify_webhook,
# confidence_check) — a flat option list, not a signature that wants an
# options object built for it.
Metrics/ParameterLists:
  Max: 10

# Buy implements the full discover -> homepage-fallback -> platform-detect ->
# adapter-fallback algorithm end to end in one class on purpose (§ PLAN.md's
# 2026-08-04 handoff) — that's breadth (one method per branch of one
# documented algorithm), not a class doing too many unrelated things. Find is
# the same shape for the search -> probe -> catalog algorithm.
Metrics/ClassLength:
  Exclude:
    - "lib/portage/cli/buy.rb"
    - "lib/portage/cli/find.rb"
    # Same rationale — PaymentMethods is enroll/list/set_default/remove/
    # freeze/revoke plus store-discovery, one class per Phase 1's whole
    # payment-method-store algorithm (docs/plans/agentic-payments.md).
    - "lib/portage/cli/payment_methods.rb"
    # One `write_*` method per scaffolded file (gemspec/Gemfile/Rakefile/
    # rubocop config/lib entrypoint/version/adapter/spec_helper/conformance
    # spec) — breadth of one template file each, not a class doing too much.
    - "lib/portage/cli/generate/adapter.rb"
    # Same rationale as Buy/Find above — HandoffReconciler implements one
    # documented algorithm end to end (settle-from-status, expiry, order
    # snapshot, journal, notify, reconnect; docs/plans/handoff-reconcile.md
    # Phase 1), not several unrelated responsibilities. The Wire* adapter
    # structs already live in their own file (handoff_reconciler/wire_adapters.rb).
    - "lib/portage/cli/handoff_reconciler.rb"
    # ProxySettings resolves one config surface (docs/plans/proxy-support.md
    # Phase 2) across many independently-precedenced fields (url, mode,
    # ca_file, proxy_headers, no_proxy, routes, chains, forward_headers) —
    # breadth of one small method per field's own flag > env > config.json
    # resolution, not a class doing unrelated things.
    - "lib/portage/cli/proxy_settings.rb"
    # One `*_finding` method per independent doctor check (authenticator,
    # rate limiter, signing keys, user agent, env-proxy footgun, payment
    # handlers, capabilities) — breadth of one flat findings list, not a
    # class doing unrelated things.
    - "lib/portage/cli/doctor.rb"
    # Same rationale — one `*_finding` method per install check (install
    # method, runtime, adapters, PATH shadowing), plus the small path/prefix
    # helpers they share (docs/plans/homebrew-distribution.md Phase 4).
    - "lib/portage/cli/install_doctor.rb"
    # Index::Builder implements one documented algorithm end to end —
    # gather -> probe new origins -> verify -> categorize -> store ->
    # record products, plus refresh/add/remove on the same data
    # (docs/plans/buy-skill-and-local-browser.md Phase 2b) — breadth of one
    # small method per step, not a class doing several unrelated things.
    - "lib/portage/cli/index/builder.rb"
    # Same rationale as Index::Builder — BrowserImport::Importer is one
    # documented algorithm end to end (read allowed files -> reduce to
    # domains -> local skip/known checks -> capped probe -> classify ->
    # report; docs/plans/buy-skill-and-local-browser.md Phase 3), with
    # domain grouping, classification and saving already split into
    # their own files (domains.rb, categorize.rb, saver.rb).
    - "lib/portage/cli/browser_import/importer.rb"
    # CdpSocket implements one small, self-contained protocol end to end —
    # the RFC 6455 handshake plus masked outbound / unmasked inbound frame
    # I/O for Chrome DevTools Protocol's WebSocket transport (docs/plans/
    # buy-skill-and-local-browser.md Phase 6) — no dependency exists for
    # this, so splitting handshake/send/receive into separate files would
    # scatter one documented wire format across files for no reader's
    # benefit.
    - "lib/portage/cli/browser_profile/cdp_socket.rb"

# Cli is argument parsing, dispatch, and formatting for two subcommands; the
# length is the flag surface, and splitting it would put `buy`'s parser and
# `buy`'s formatter in different files for no reader's benefit.
Metrics/ModuleLength:
  Exclude:
    - "lib/portage/cli.rb"

# `cx` is Google's own name for a Programmable Search engine id (GOOGLE_CSE_CX).
# AllowedNames replaces the default list rather than extending it, so the
# defaults are repeated here.
Naming/MethodParameterName:
  AllowedNames:
    - "at"
    - "by"
    - "cc"
    - "cx"
    - "db"
    - "id"
    - "if"
    - "in"
    - "io"
    - "ip"
    - "of"
    - "on"
    - "os"
    - "pp"
    - "to"

Lint/UnusedMethodArgument:
  Exclude:
    - "spec/**/*.rb"

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false
