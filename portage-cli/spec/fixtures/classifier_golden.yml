# Golden set for Portage::Cli::Classifier (docs/plans/local-catalogue.md, Phase 5).
#
# Each case: `text` (what a caller hands Classifier.categories_for), `expect`
# (the Google taxonomy id a person would call the right top-1 category, from
# the top two levels that categories.yml keys on; "none" means no category),
# `source` (where the text came from) and an optional `must_not_include` (ids
# that must not appear anywhere in the result).
#
# Labels were written from the products, not from the classifier's output.
# Storefront cases use the text StorefrontProducts::Mapper classifies:
# product_type followed by the tags, joined by spaces. Light Yard and JB Hi-Fi
# texts are real products.json data (2026-09-30).
