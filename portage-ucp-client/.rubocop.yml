AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "*.gemspec"

Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 25

Metrics/ParameterLists:
  Max: 6
  Exclude:
    # .connect's 7th keyword (proxy:, docs/plans/proxy-support.md Phase 1)
    # is a plain pass-through to Transports::Http, same breadth as the six
    # already there (command:/args:/env:/url:/headers:/capabilities:).
    - "lib/portage/ucp/client.rb"

Lint/UnusedMethodArgument:
  Exclude:
    - "spec/**/*.rb"

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false
