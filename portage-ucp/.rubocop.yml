AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "*.gemspec"
    # shared_examples is spec content shipped from lib/ (an adapter author's
    # own spec suite runs it), not application code — same rationale as the
    # spec/**/*.rb exclude above.
    - "lib/portage/ucp/rspec.rb"

Metrics/MethodLength:
  Max: 15

Metrics/ParameterLists:
  Max: 6
  Exclude:
    # Manifest.new takes one keyword per top-level manifest field (business,
    # payment_handlers, signing_keys, signer, services) so each can be passed
    # explicitly or fall back to Portage::Ucp.configuration independently —
    # collapsing them into an options hash would lose that per-field default.
    - "lib/portage/ucp/manifest.rb"
    # Checkout#initialize's 7th param (order:) mirrors the real schema's
    # optional order_confirmation field — same one-keyword-per-wire-field
    # rationale as manifest.rb above, not a sign the object needs splitting.
    - "lib/portage/ucp/value_objects.rb"
    # One keyword per Product field the spec seeds — same rationale as
    # value_objects.rb above, applied to the fixture builder every core-gem
    # spec shares instead of hand-assembling Price/Description/Variant/
    # Product itself.
    - "spec/support/product_factory.rb"

Style/HashSlice:
  Enabled: false

# Breadth, not complexity — one Data.define + to_wire_h per wire-schema type
# (Fulfillment/Expectation/FulfillmentEvent/Adjustment alongside the existing
# Total/Item/LineItem/etc.), same rationale as the ParameterLists exclude above.
Metrics/ModuleLength:
  Exclude:
    - "lib/portage/ucp/value_objects.rb"

# Product/Variant's optional_wire_h methods each omit ~5 independently-
# optional wire fields (one `if`/`unless` per field, same "omit when absent"
# posture every other value object in this file already uses) — that's the
# schema's own field count, not tangled logic. Same breadth-not-complexity
# rationale as the ModuleLength exclude above, on the same file.
Metrics/AbcSize:
  Max: 25
  Exclude:
    - "lib/portage/ucp/value_objects.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/portage/ucp/value_objects.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/portage/ucp/value_objects.rb"

# One Platform entry per adapter gem (marker regexes + env var names + build
# lambdas) — that's breadth (one declaration per platform), not a class doing
# too many unrelated things. Same justification style as portage-ucp-shopify's
# Adapter/Mapper excludes.
Metrics/ClassLength:
  Exclude:
    - "lib/portage/ucp/resolver.rb"
    # FakeAdapter now covers the full cart/checkout/order lifecycle
    # (catalog/cart/checkout/order), one small method per action — breadth,
    # not a class doing too many unrelated things.
    - "spec/support/fake_adapter.rb"
    # ReferenceAdapter covers the same full lifecycle as FakeAdapter above,
    # plus discount/fulfillment/identity — same breadth-not-complexity
    # rationale, wider surface since it's the shipped conformance fixture.
    - "lib/portage/ucp/reference_adapter.rb"

Lint/UnusedMethodArgument:
  Exclude:
    - "lib/portage/ucp/adapter.rb"
    - "lib/portage/ucp/reference_adapter.rb"
    - "spec/**/*.rb"

Lint/MissingSuper:
  Exclude:
    - "spec/**/*.rb"

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false
