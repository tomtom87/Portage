AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "*.gemspec"

Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 25

Metrics/ParameterLists:
  Max: 6

Metrics/ModuleLength:
  Exclude:
    - "lib/ucp_mcp/shopify/queries.rb"

Lint/UnusedMethodArgument:
  Exclude:
    - "spec/**/*.rb"

# Gem entrypoint files conventionally mirror the (hyphenated) gem name.
Naming/FileName:
  Exclude:
    - "lib/ucp_mcp-shopify.rb"

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false
